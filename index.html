
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171326">
<title>欠账记账</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --wallpaper:none;
  --glass:rgba(255,255,255,.16);
  --glass-border:rgba(255,255,255,.25);
  --text:#fff;
  --muted:rgba(255,255,255,.7);
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background:#171326;
  overscroll-behavior:none;
}

body{
  min-height:100dvh;
  position:relative;
  isolation:isolate;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background-image:var(--wallpaper),linear-gradient(145deg,#171326,#30204c,#171326);
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:rgba(13,10,28,.28);
}

button,input{font:inherit;outline:none}
button{border:none;cursor:pointer}

.app{
  width:100%;
  max-width:650px;
  min-height:100dvh;
  margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 25px);
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:27px;
}

.header h1{
  margin:0;
  font-size:26px;
  font-weight:800;
  letter-spacing:-.5px;
  text-shadow:0 2px 12px rgba(0,0,0,.2);
}

.header-sub{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}

.wallpaper-actions{
  display:flex;
  flex-direction:column;
  gap:7px;
  flex-shrink:0;
}

.wallpaper-btn,.reset-wallpaper-btn{
  padding:9px 12px;
  border-radius:12px;
  color:#fff;
  background:rgba(255,255,255,.17);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  font-size:12px;
}

.reset-wallpaper-btn{
  background:rgba(0,0,0,.18);
  color:rgba(255,255,255,.8);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 2px 16px;
}

.section-title h2{
  margin:0;
  font-size:17px;
  font-weight:700;
}

.add-btn{
  padding:11px 16px;
  border-radius:13px;
  background:rgba(255,255,255,.22);
  border:1px solid var(--glass-border);
  color:#fff;
  font-size:13px;
  font-weight:650;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.filter-btn{
  flex:1;
  padding:13px 8px;
  border-radius:13px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.8);
  font-size:14px;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.filter-btn.active{
  background:rgba(255,255,255,.3);
  border-color:rgba(255,255,255,.48);
  color:#fff;
  font-weight:750;
}

.bill-list{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.bill-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:18px 16px;
  border-radius:18px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.23);
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  cursor:pointer;
}

.bill-left{min-width:0;flex:1}

.bill-name{
  font-size:15px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.bill-meta{
  margin-top:7px;
  font-size:11px;
  color:rgba(255,255,255,.65);
}

.bill-right{text-align:right;flex-shrink:0}

.bill-amount{
  font-size:17px;
  font-weight:800;
}

.bill-amount.in{color:#8df2c2}
.bill-amount.out{color:#ffb3a6}

.bill-status{
  display:inline-block;
  margin-top:6px;
  padding:4px 9px;
  border-radius:20px;
  background:rgba(255,255,255,.15);
  color:rgba(255,255,255,.75);
  font-size:10px;
}

.bill-status.settled{
  background:rgba(56,200,139,.2);
  color:#9af2c8;
}

.empty{
  padding:45px 15px;
  text-align:center;
  color:rgba(255,255,255,.65);
  font-size:13px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  border-radius:17px;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

/* 弹窗 */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.45);
  padding-top:30px;
}

.modal.show{display:flex}

.modal-card{
  width:100%;
  max-width:650px;
  max-height:88dvh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:22px 20px calc(env(safe-area-inset-bottom) + 25px);
  border-radius:24px 24px 0 0;
  background:rgba(32,26,51,.82);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modal-header h3{
  margin:0;
  font-size:19px;
  font-weight:750;
}

.close-btn{
  width:33px;
  height:33px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:20px;
}

.form-group{margin-bottom:17px}

.form-group label{
  display:block;
  margin-bottom:9px;
  color:rgba(255,255,255,.75);
  font-size:13px;
}

.form-group input{
  width:100%;
  height:49px;
  padding:0 14px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:13px;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:15px;
}

input::placeholder{color:rgba(255,255,255,.45)}

.type-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.type-option{
  padding:13px 8px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.75);
  font-size:13px;
}

.type-option.active{
  border-color:rgba(255,255,255,.55);
  background:rgba(255,255,255,.25);
  color:#fff;
  font-weight:700;
}

.primary-btn{
  width:100%;
  height:49px;
  border-radius:13px;
  background:rgba(255,255,255,.88);
  color:#292039;
  font-size:15px;
  font-weight:750;
}

.detail-top{
  padding:21px 16px;
  border-radius:17px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.17);
  text-align:center;
  margin-bottom:18px;
}

.detail-name{font-size:18px;font-weight:750}
.detail-type{margin-top:7px;color:rgba(255,255,255,.65);font-size:12px}
.detail-amount{margin-top:17px;font-size:30px;font-weight:850}
.detail-amount.in{color:#8df2c2}
.detail-amount.out{color:#ffb3a6}

.detail-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.info-box{
  padding:14px;
  border-radius:13px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.15);
}

.info-label{color:rgba(255,255,255,.6);font-size:11px}
.info-value{margin-top:7px;font-size:16px;font-weight:750}

.history-title{
  margin:20px 0 12px;
  font-size:14px;
  font-weight:750;
}

.history-list{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-bottom:20px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  border-radius:12px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.12);
  font-size:13px;
}

.history-date{
  color:rgba(255,255,255,.55);
  font-size:11px;
  margin-top:5px;
}

.history-money{font-weight:750}
.history-money.repay{color:#8df2c2}
.history-money.increase{color:#b9caff}

.action-area{
  padding-top:17px;
  margin-top:15px;
  border-top:1px solid rgba(255,255,255,.15);
}

.action-title{
  margin-bottom:12px;
  font-size:14px;
  font-weight:750;
}

.action-input{
  display:flex;
  gap:9px;
  margin-bottom:12px;
}

.action-input input{
  min-width:0;
  flex:1;
  height:47px;
  padding:0 13px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:15px;
}

.action-btn{
  padding:0 15px;
  border-radius:12px;
  color:white;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.repay-btn{background:rgba(32,167,121,.85)}
.increase-btn{background:rgba(76,111,204,.9)}

.settled-note{
  padding:14px;
  border-radius:12px;
  background:rgba(56,200,139,.18);
  color:#9af2c8;
  text-align:center;
  font-size:13px;
}

@media(min-width:650px){
  .modal{align-items:center}
  .modal-card{border-radius:24px;max-height:85dvh}
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div>
      <h1>欠账记账</h1>
      <div class="header-sub">清晰记录每一笔往来</div>
    </div>

    <div class="wallpaper-actions">
      <button class="wallpaper-btn" id="wallpaperBtn">更换壁纸</button>
      <button class="reset-wallpaper-btn" id="resetWallpaper">恢复默认</button>
    </div>
  </header>

  <input
    id="wallpaperInput"
    type="file"
    accept="image/*"
    hidden
  >

  <div class="section-title">
    <h2>账单记录</h2>
    <button class="add-btn" id="openAdd">＋ 添加账单</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="in">别人欠我</button>
    <button class="filter-btn" data-filter="out">我欠别人</button>
  </div>

  <div class="bill-list" id="billList"></div>

</div>

<!-- 添加账单 -->
<div class="modal" id="addModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>添加账单</h3>
      <button class="close-btn" data-close="addModal">×</button>
    </div>

    <div class="form-group">
      <label>账单类型</label>
      <div class="type-options" id="typeOptions">
        <button class="type-option active" data-type="in">别人欠我的</button>
        <button class="type-option" data-type="out">我欠别人的</button>
      </div>
    </div>

    <div class="form-group">
      <label>姓名 / 备注</label>
      <input id="billName" type="text" placeholder="请输入姓名或备注" maxlength="40">
    </div>

    <div class="form-group">
      <label>金额（元）</label>
      <input id="billAmount" type="number" inputmode="decimal" placeholder="请输入金额">
    </div>

    <button class="primary-btn" id="saveBill">保存账单</button>
  </div>
</div>

<!-- 账单详情 -->
<div class="modal" id="detailModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>账单详情</h3>
      <button class="close-btn" data-close="detailModal">×</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<script>
const STORAGE_KEY='debt-tracker-v1';

const DB_NAME='debt-tracker-wallpaper';
const DB_STORE='settings';

const $=selector=>document.querySelector(selector);

let records=[];
let currentFilter='in';
let selectedType='in';
let currentId=null;
let wallpaperURL=null;
let wallpaperDB=null;

/* IndexedDB：专门保存壁纸，不占用账单存储空间 */

function openWallpaperDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('当前浏览器不支持本地壁纸保存'));
      return;
    }

    const request=indexedDB.open(DB_NAME,1);

    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        db.createObjectStore(DB_STORE);
      }
    };

    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}

function saveWallpaper(blob){
  return new Promise((resolve,reject)=>{
    if(!wallpaperDB){
      reject(new Error('壁纸存储尚未准备好'));
      return;
    }

    const tx=wallpaperDB.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(blob,'background');

    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  });
}

function readWallpaper(){
  return new Promise((resolve,reject)=>{
    if(!wallpaperDB){
      reject(new Error('壁纸存储尚未准备好'));
      return;
    }

    const tx=wallpaperDB.transaction(DB_STORE,'readonly');
    const request=tx.objectStore(DB_STORE).get('background');

    request.onsuccess=()=>resolve(request.result||null);
    request.onerror=()=>reject(request.error);
  });
}

function deleteWallpaper(){
  return new Promise((resolve,reject)=>{
    if(!wallpaperDB){
      reject(new Error('壁纸存储尚未准备好'));
      return;
    }

    const tx=wallpaperDB.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).delete('background');

    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

function applyWallpaper(blob){
  if(wallpaperURL){
    URL.revokeObjectURL(wallpaperURL);
    wallpaperURL=null;
  }

  if(!blob){
    document.documentElement.style.setProperty('--wallpaper','none');
    return;
  }

  wallpaperURL=URL.createObjectURL(blob);

  const safeURL=wallpaperURL.replace(/["\\]/g,'');
  document.documentElement.style.setProperty(
    '--wallpaper',
    `url("${safeURL}")`
  );
}

async function initWallpaper(){
  try{
    wallpaperDB=await openWallpaperDB();
    const blob=await readWallpaper();
    if(blob)applyWallpaper(blob);
  }catch(error){
    console.error('壁纸读取失败：',error);
  }
}

/* 选择并保存壁纸 */

$('#wallpaperBtn').addEventListener('click',()=>{
  $('#wallpaperInput').click();
});

$('#wallpaperInput').addEventListener('change',async e=>{
  const file=e.target.files?.[0];
  if(!file)return;

  if(!file.type.startsWith('image/')){
    alert('请选择图片文件');
    e.target.value='';
    return;
  }

  if(file.size>20*1024*1024){
    alert('图片太大，请选择20MB以内的图片');
    e.target.value='';
    return;
  }

  try{
    let blob=file;

    // 尝试压缩大图片，降低手机存储占用
    if('createImageBitmap' in window){
      try{
        const bitmap=await createImageBitmap(file);
        const maxWidth=1800;
        const scale=Math.min(1,maxWidth/bitmap.width);
        const canvas=document.createElement('canvas');

        canvas.width=Math.round(bitmap.width*scale);
        canvas.height=Math.round(bitmap.height*scale);

        const ctx=canvas.getContext('2d');
        ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
        bitmap.close();

        blob=await new Promise(resolve=>{
          canvas.toBlob(result=>resolve(result||file),'image/jpeg',.86);
        });
      }catch(error){
        blob=file;
      }
    }

    await saveWallpaper(blob);
    applyWallpaper(blob);
    alert('壁纸已保存！');
  }catch(error){
    console.error(error);
    alert('壁纸保存失败，请检查浏览器存储权限或更换图片');
  }

  e.target.value='';
});

/* 恢复默认壁纸 */

$('#resetWallpaper').addEventListener('click',async()=>{
  if(!confirm('确定恢复默认背景吗？'))return;

  try{
    await deleteWallpaper();
    applyWallpaper(null);
    alert('已恢复默认背景');
  }catch(error){
    alert('恢复失败，请稍后重试');
  }
});

/* 金额和账单 */

function money(value){
  return Math.round((Number(value)||0)*100)/100;
}

function formatMoney(value){
  return '¥'+money(value).toFixed(2);
}

function escapeHTML(value){
  return String(value??'').replace(/[&<>"']/g,char=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
}

function load(){
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
    records=Array.isArray(data)?data:[];
  }catch{
    records=[];
  }

  records.forEach(r=>{
    if(r.originalAmount==null)r.originalAmount=r.amount;
    if(r.paidAmount==null)r.paidAmount=money(r.originalAmount-r.amount);
    if(!Array.isArray(r.history))r.history=[];

    r.originalAmount=money(r.originalAmount);
    r.paidAmount=money(r.paidAmount);
    r.amount=Math.max(0,money(r.originalAmount-r.paidAmount));
    r.settled=Boolean(r.settled)||r.amount<=0;
  });

  save();
}

function renderList(){
  const list=$('#billList');

  const filtered=records
    .filter(r=>r.type===currentFilter)
    .sort((a,b)=>Number(b.createdAt)-Number(a.createdAt));

  if(!filtered.length){
    list.innerHTML='<div class="empty">暂无账单记录</div>';
    return;
  }

  list.innerHTML=filtered.map(r=>`
    <div class="bill-item" data-id="${escapeHTML(r.id)}">
      <div class="bill-left">
        <div class="bill-name">${escapeHTML(r.name)}</div>
        <div class="bill-meta">
          ${r.type==='in'?'别人欠我的':'我欠别人的'} · ${escapeHTML(r.date||'')}
        </div>
      </div>

      <div class="bill-right">
        <div class="bill-amount ${r.type}">${formatMoney(r.amount)}</div>
        <div class="bill-status ${r.settled?'settled':''}">
          ${r.settled?'已结清':'待还款'}
        </div>
      </div>
    </div>
  `).join('');
}

function showModal(id){
  $('#'+id).classList.add('show');
}

function closeModal(id){
  $('#'+id).classList.remove('show');
}

function openDetail(id){
  const r=records.find(item=>String(item.id)===String(id));
  if(!r)return;

  currentId=id;

  const historyHTML=r.history.length
    ?[...r.history].reverse().map(item=>{
      const isIncrease=item.type==='increase';

      return `
        <div class="history-item">
          <div>
            <div>${isIncrease?'增加金额':'还款记录'}</div>
            <div class="history-date">${escapeHTML(item.date||'')}</div>
          </div>
          <div class="history-money ${isIncrease?'increase':'repay'}">
            ${isIncrease?'+':'−'}${formatMoney(item.amount)}
          </div>
        </div>
      `;
    }).join('')
    :'<div class="empty" style="padding:20px">暂无变动记录</div>';

  $('#detailContent').innerHTML=`
    <div class="detail-top">
      <div class="detail-name">${escapeHTML(r.name)}</div>
      <div class="detail-type">${r.type==='in'?'别人欠我的':'我欠别人的'}</div>
      <div class="detail-amount ${r.type}">${formatMoney(r.amount)}</div>
      <div class="detail-type">${r.settled?'已全部结清':'当前剩余金额'}</div>
    </div>

    <div class="detail-info">
      <div class="info-box">
        <div class="info-label">累计账单金额</div>
        <div class="info-value">${formatMoney(r.originalAmount)}</div>
      </div>

      <div class="info-box">
        <div class="info-label">累计已还金额</div>
        <div class="info-value">${formatMoney(r.paidAmount)}</div>
      </div>
    </div>

    <div class="history-title">金额变动记录</div>
    <div class="history-list">${historyHTML}</div>

    <div class="action-area">
      <div class="action-title">增加金额</div>
      <div class="action-input">
        <input id="increaseAmount" type="number" inputmode="decimal" placeholder="输入需要增加的金额">
        <button class="action-btn increase-btn" id="increaseBtn">确认增加</button>
      </div>
    </div>

    ${r.settled?'':`
      <div class="action-area">
        <div class="action-title">${r.type==='in'?'记录对方还款':'记录我的还款'}</div>
        <div class="action-input">
          <input id="repayAmount" type="number" inputmode="decimal" placeholder="输入本次还款金额">
          <button class="action-btn repay-btn" id="repayBtn">确认还款</button>
        </div>
      </div>
    `}

    ${r.settled?'<div class="settled-note">这笔账单已经全部结清</div>':''}
  `;

  showModal('detailModal');
}

/* 增加金额 */

function increaseBillAmount(){
  const r=records.find(item=>String(item.id)===String(currentId));
  if(!r)return;

  const amount=money($('#increaseAmount')?.value);

  if(!amount||amount<=0){
    alert('请输入正确的增加金额');
    return;
  }

  r.originalAmount=money(r.originalAmount+amount);
  r.amount=money(r.amount+amount);
  r.settled=false;

  r.history.push({
    type:'increase',
    amount,
    date:new Date().toLocaleString('zh-CN',{hour12:false})
  });

  save();
  renderList();
  openDetail(currentId);
}

/* 记录还款 */

function makeRepayment(){
  const r=records.find(item=>String(item.id)===String(currentId));
  if(!r||r.settled)return;

  const amount=money($('#repayAmount')?.value);

  if(!amount||amount<=0){
    alert('请输入正确的还款金额');
    return;
  }

  if(amount>r.amount){
    alert('还款金额不能大于剩余金额');
    return;
  }

  r.paidAmount=money(r.paidAmount+amount);
  r.amount=Math.max(0,money(r.originalAmount-r.paidAmount));

  r.history.push({
    type:'repay',
    amount,
    date:new Date().toLocaleString('zh-CN',{hour12:false})
  });

  if(r.amount<=0.001){
    r.amount=0;
    r.paidAmount=r.originalAmount;
    r.settled=true;
  }

  save();
  renderList();
  openDetail(currentId);
}

/* 添加账单 */

function updateTypeButtons(){
  document.querySelectorAll('.type-option').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.type===selectedType);
  });
}

$('#openAdd').addEventListener('click',()=>{
  $('#billName').value='';
  $('#billAmount').value='';
  selectedType=currentFilter;
  updateTypeButtons();
  showModal('addModal');
});

$('#typeOptions').addEventListener('click',e=>{
  const btn=e.target.closest('.type-option');
  if(!btn)return;

  selectedType=btn.dataset.type;
  updateTypeButtons();
});

$('#saveBill').addEventListener('click',()=>{
  const name=$('#billName').value.trim();
  const amount=money($('#billAmount').value);

  if(!name){
    alert('请输入姓名或备注');
    return;
  }

  if(!amount||amount<=0){
    alert('请输入正确的金额');
    return;
  }

  const now=new Date();

  records.push({
    id:String(Date.now())+Math.random().toString(16).slice(2,6),
    type:selectedType,
    name,
    amount,
    originalAmount:amount,
    paidAmount:0,
    history:[],
    settled:false,
    createdAt:Date.now(),
    date:now.toLocaleDateString('zh-CN')
  });

  currentFilter=selectedType;

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.filter===currentFilter);
  });

  save();
  renderList();
  closeModal('addModal');
});

/* 列表点击 */

$('#billList').addEventListener('click',e=>{
  const item=e.target.closest('.bill-item');
  if(!item)return;
  openDetail(item.dataset.id);
});

/* 详情操作 */

$('#detailContent').addEventListener('click',e=>{
  if(e.target.closest('#repayBtn')){
    makeRepayment();
  }

  if(e.target.closest('#increaseBtn')){
    increaseBillAmount();
  }
});

/* 分类切换 */

$('#filters').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn)return;

  currentFilter=btn.dataset.filter;

  document.querySelectorAll('.filter-btn').forEach(item=>{
    item.classList.toggle('active',item===btn);
  });

  renderList();
});

/* 关闭弹窗 */

document.addEventListener('click',e=>{
  const close=e.target.closest('[data-close]');
  if(close)closeModal(close.dataset.close);

  if(e.target.classList.contains('modal')){
    e.target.classList.remove('show');
  }
});

/* iPhone 手势缩放限制 */

document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());

/* 启动 */

load();
renderList();
initWallpaper();
</script>

</body>
</html>
