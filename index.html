<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171321">

<!-- ===== PWA / 全屏 & 图标 meta ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="账本">
<meta name="application-name" content="账本">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="简单好用的借还账本">

<title>账本</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:#171321}
body.modal-open{overflow:hidden}
button,input{font:inherit}
button{color:inherit;border:0;cursor:pointer}

/* ===== 壁纸满屏处理 ===== */
#wallpaperLayer {
 position: fixed;
 top: 0;
 left: 0;
 right: 0;
 bottom: 0;
 width: 100%;
 height: 100%;
 z-index: -2;
 overflow: hidden;
 background: #171321;
}
#wallpaperImage{width:100%;height:100%;object-fit:cover;object-position:center;display:none}
#wallpaperShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,9,25,.38),rgba(12,9,25,.48))}

.app{
 width:100%;
 max-width:600px;
 min-height:100vh;
 min-height:100dvh;
 margin:auto;
 padding:calc(env(safe-area-inset-top) + 51px) 17px calc(env(safe-area-inset-bottom) + 28px);
}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}

/* ===== 隐藏了品牌文字，仅保留金币图标 ===== */
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.coin{
 width:49px;height:49px;border-radius:50%;flex-shrink:0;
 display:grid;place-items:center;font-size:27px;
 background:radial-gradient(circle at 32% 25%,#fff4a8 0 7%,#ffd85b 20%,#e99a19 56%,#9c4c08 100%);
 border:2px solid rgba(255,238,166,.9);
 box-shadow:0 0 0 3px rgba(255,196,64,.13),0 5px 18px rgba(255,173,40,.25),inset 0 2px 5px rgba(255,255,255,.65);
}
.wallpaper-btn{
 width:43px;height:43px;border-radius:50%;flex-shrink:0;
 background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.1));
 border:1px solid rgba(255,255,255,.42);
 box-shadow:0 5px 18px rgba(0,0,0,.2),inset 0 1px 5px rgba(255,255,255,.25);
 font-size:29px;font-weight:300;line-height:1;
 display:grid;place-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.wallpaper-btn:active,.primary-btn:active,.filter-btn:active{transform:scale(.96)}
#wallpaperInput{display:none}

.glass{
 background:rgba(255,255,255,.13);
 border:1px solid rgba(255,255,255,.23);
 box-shadow:0 8px 28px rgba(0,0,0,.15),inset 0 1px 1px rgba(255,255,255,.13);
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)
}
.add-area{display:flex;justify-content:center;margin:8px 0 23px}
.primary-btn{
 min-width:180px;padding:14px 28px;border-radius:18px;
 background:linear-gradient(135deg,#a879ff,#7654e8);
 box-shadow:0 8px 24px rgba(119,75,220,.35),inset 0 1px 1px rgba(255,255,255,.4);
 font-size:16px;font-weight:800;letter-spacing:1px;
 transition:transform .15s
}
.primary-btn span{font-size:20px;margin-right:7px;vertical-align:-1px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:25px}
.filter-btn{padding:13px 8px;border-radius:15px;font-size:14px;font-weight:750;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.filter-btn.active{background:linear-gradient(135deg,rgba(169,124,255,.88),rgba(113,83,226,.88));border-color:rgba(255,255,255,.4);box-shadow:0 5px 18px rgba(105,73,205,.25)}
.section-title{font-size:17px;font-weight:800;margin:0 0 14px 3px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.bill-list{display:flex;flex-direction:column;gap:11px}
.bill-card{padding:16px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:transform .15s}
.bill-card:active{transform:scale(.985)}
.bill-info{min-width:0;flex:1}
.bill-name{font-size:15px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 红色毛玻璃标签 ===== */
.bill-type-tag {
 display: inline-flex;
 align-items: center;
 padding: 4px 9px;
 margin-top: 7px;
 font-size: 11px;
 font-weight: 700;
 border-radius: 7px;
 background: rgba(255, 69, 58, 0.22);
 border: 1px solid rgba(255, 100, 90, 0.45);
 backdrop-filter: blur(12px);
 -webkit-backdrop-filter: blur(12px);
 color: #ffb3b3;
 box-shadow: 0 2px 8px rgba(255, 59, 48, 0.15), inset 0 1px 1px rgba(255,255,255,0.15);
}

.bill-right{text-align:right;flex-shrink:0}
.bill-amount{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}
.bill-status{font-size:11px;margin-top:5px;color:#b9f5cf}
.bill-status.done{color:#c9c3d5}
.empty{padding:38px 15px;text-align:center;color:rgba(255,255,255,.75);font-size:13px;border-radius:18px}
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.52);padding:15px;padding-bottom:calc(env(safe-area-inset-bottom) + 15px);overscroll-behavior:contain}
.modal.show{display:flex}
.modal-card{width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:25px;padding:22px 19px;background:rgba(31,25,48,.91);border:1px solid rgba(255,255,255,.2);box-shadow:0 15px 50px rgba(0,0,0,.35);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:850}
.close-btn{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.13);font-size:20px}
.field{margin:15px 0}
.field label{display:block;font-size:13px;color:rgba(255,255,255,.72);margin-bottom:9px}
.field input{width:100%;height:47px;border-radius:13px;padding:0 13px;color:#fff;outline:none;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);font-size:16px}
.field input::placeholder{color:rgba(255,255,255,.4)}
.type-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-option{padding:12px 7px;border-radius:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:700}
.type-option.active{background:rgba(153,112,255,.45);border-color:#bda1ff}
.action-btn{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#a879ff,#7654e8);font-size:15px;font-weight:800;margin-top:12px}
.secondary-btn{width:100%;padding:13px;border-radius:14px;background:rgba(255,255,255,.12);font-size:14px;font-weight:750;margin-top:10px;border:1px solid rgba(255,255,255,.16)}
.detail-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.summary-cell{padding:12px 8px;border-radius:13px;text-align:center;background:rgba(255,255,255,.09)}
.summary-label{font-size:11px;color:rgba(255,255,255,.62);margin-bottom:8px}
.summary-value{font-size:15px;font-weight:850;overflow-wrap:anywhere}
.detail-name{font-size:19px;font-weight:850;margin-bottom:16px;overflow-wrap:anywhere}
.history-title{font-size:14px;font-weight:800;margin:20px 0 11px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px;gap:10px}
.history-type{color:rgba(255,255,255,.72)}
.history-date{font-size:11px;color:rgba(255,255,255,.48);margin-top:5px}
.history-amount{font-weight:800;white-space:nowrap}
.history-amount.repay{color:#8ff0b2}
.history-amount.increase{color:#8ecaff}
.no-history{font-size:12px;color:rgba(255,255,255,.5);padding:12px 0}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);padding:11px 18px;border-radius:20px;background:rgba(25,20,39,.92);border:1px
